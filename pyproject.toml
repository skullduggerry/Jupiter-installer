# The settings of the tools Jupiter-testing's checks run, which editors read
# too. The installer itself needs nothing beyond Python's standard library,
# but for phase 3's keyring step: python-gobject, which nixos/desktop.nix
# installs.

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "SIM", "RUF", "PLW1510"]

[tool.mypy]
strict = true
