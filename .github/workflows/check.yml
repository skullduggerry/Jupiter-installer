# Checks every push and pull request to the installer, on both systems it
# installs, and nothing of the other Jupiter repos: Jupiter-dotfiles' own
# check.yml checks the dotfiles, and Jupiter-testing's, where the tests and
# linters live, checks all three with its tools as pushed. The installer's
# suites read the dotfiles it installs, which come from main (or this branch, where the
# dotfiles have it): a change there that breaks the installer shows here by
# the next daily run. Daily on main as well, as Arch's packages move between
# pushes (nixpkgs moves with flake.lock, which update-flake-lock.yml updates,
# running this file's checks on it). The repos are laid out by
# Jupiter-testing's scripts/ci-repos.sh.
#
#   arch   in an Arch container: the installer's formatting and linters,
#          then its suites (./check.sh lint, ./check.sh test installer), its
#          phases on Arch and on NixOS, its NixOS modules evaluated by Nix
#          against the flake's own nixpkgs. Privileged: the suites'
#          stand-ins use unshare.
#   nixos  on the runner's Nix, Jupiter-testing's scripts/nixos-check.sh
#          installer: the flake, with its locked inputs, evaluated and its
#          login helpers and home-manager generation built.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

# The token reads the repo, nothing more: the steps run other repos'
# branches' code.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The branch the repos are laid out by (a pull request's own, not its merge).
  BRANCH: ${{ github.head_ref || github.ref_name }}

# bash -eo pipefail: a failing command fails its step, in a pipe too.
defaults:
  run:
    shell: bash

jobs:
  arch:
    name: "Arch: lint and test"
    runs-on: ubuntu-latest
    # A hung test fails in hours, not GitHub's six.
    timeout-minutes: 120
    env:
      # Nix's settings in the container, with the job's token for GitHub's
      # API, as install-nix-action gives the nixos job: unauthenticated,
      # fetching the flake's inputs runs into its rate limit.
      NIX: |
        experimental-features = nix-command flakes
        build-users-group =
        sandbox = false
        access-tokens = github.com=${{ github.token }}
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install packages
        # What Jupiter-testing's lint.sh and test.sh ask for the installer,
        # with mypy's stubs; xdg-user-dirs and sudo's visudo check the home
        # folders and sudo rules the phases write.
        # [multilib] for the package-list test; nix for the NixOS side
        # (nixfmt, statix and deadnix, which Arch has no package of, come
        # from it).
        run: |
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git sudo \
            ruff mypy python-pygobject-stubs shellcheck shfmt nix actionlint \
            python-coverage python-gobject util-linux file xdg-user-dirs diffutils
          pacman -Q python nix
      - name: Create test user
        # Root reads every file, which the permission checks rely on not
        # doing, and phases 2 to 4 refuse it. Nix runs as that user too,
        # single-user, its store theirs.
        run: |
          useradd -m ci
          install -d -o ci /nix
          chown -R ci: /nix
      - uses: actions/checkout@v7
        with:
          path: checkout
      - name: Clone repos
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          as_ci() { sudo -u ci -H env GIT_TERMINAL_PROMPT=0 "$@"; }
          url=https://github.com/skullduggerry/Jupiter-testing.git
          as_ci git clone --quiet --depth 1 --branch "$BRANCH" "$url" Jupiter-testing 2>/dev/null ||
            as_ci git clone --quiet --depth 1 "$url" Jupiter-testing
          as_ci bash Jupiter-testing/scripts/ci-repos.sh checkout "$BRANCH"
      - name: Find flake nixpkgs
        id: nixpkgs
        # The NixOS suites evaluate the modules against the nixpkgs
        # flake.lock pins.
        run: |
          nixpkgs=$(sudo -u ci -H env NIX_CONFIG="$NIX" nix eval --raw --impure --expr \
            "(builtins.getFlake \"path:$GITHUB_WORKSPACE/Jupiter-installer\").inputs.nixpkgs.outPath")
          echo "JUPITER_NIXPKGS=$nixpkgs" >> "$GITHUB_ENV"
          # The Nix linters (nixfmt, statix, deadnix), from the same nixpkgs.
          sudo -u ci -H env NIX_CONFIG="$NIX" nix build --impure --out-link /home/ci/tools/nix \
            --expr "with import $nixpkgs { }; buildEnv { name = \"nix-linters\"; paths = [ nixfmt statix deadnix ]; }"
      - name: Lint
        run: |
          cd Jupiter-installer
          sudo -u ci -H env PATH="/home/ci/tools/nix/bin:$PATH" ./check.sh lint
      - name: Test
        # After a failed lint too, while the repo is there to test.
        if: (success() || failure()) && steps.nixpkgs.outcome == 'success'
        run: |
          cd Jupiter-installer
          sudo -u ci -H env PATH="/home/ci/tools/nix/bin:$PATH" \
            JUPITER_NIXPKGS="$JUPITER_NIXPKGS" NIX_CONFIG="$NIX" ./check.sh test installer

  nixos:
    name: "NixOS: check flake"
    runs-on: ubuntu-latest
    # A hung test fails in hours, not GitHub's six.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: checkout
      - uses: cachix/install-nix-action@v31
      - name: Clone repos
        run: |
          export GIT_TERMINAL_PROMPT=0
          url=https://github.com/skullduggerry/Jupiter-testing.git
          git clone --quiet --depth 1 --branch "$BRANCH" "$url" Jupiter-testing 2>/dev/null ||
            git clone --quiet --depth 1 "$url" Jupiter-testing
          bash Jupiter-testing/scripts/ci-repos.sh checkout "$BRANCH"
      - name: Check NixOS system
        # Jupiter-testing's scripts/nixos-check.sh says what it checks; the
        # update of flake.lock runs it too, the dotfiles' part as well.
        run: bash Jupiter-testing/scripts/nixos-check.sh installer
